# ============================================================
# Ombre Brain — 用户部署版（从当前安全源码构建）
# User deployment (build the current authenticated source)
#
# 使用方法 / Usage:
#   1. 创建 .env，至少配置 OMBRE_API_KEY、OMBRE_API_TOKEN、OMBRE_MCP_TOKEN
#   2. 按需修改下面的 volumes 路径
#   3. docker compose -f docker-compose.user.yml up -d
# ============================================================

services:
  ombre-brain:
    build: .
    image: ombre-brain:local
    container_name: ombre-brain
    restart: unless-stopped
    ports:
      - "${OMBRE_BIND_ADDRESS:-127.0.0.1}:${OMBRE_HOST_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - OMBRE_API_KEY=${OMBRE_API_KEY}
      - OMBRE_TRANSPORT=streamable-http
      - OMBRE_BUCKETS_DIR=/data
      - OMBRE_API_TOKEN=${OMBRE_API_TOKEN:?required}
      - OMBRE_MCP_TOKEN=${OMBRE_MCP_TOKEN:?required}
      - OMBRE_LMC5_NIGHT_ENABLED=${OMBRE_LMC5_NIGHT_ENABLED:-0}
      - OMBRE_LMC5_SNAPSHOT_DIR=/snapshots
    volumes:
      # 改成你的 Obsidian Vault 路径，或保持 ./buckets 用本地目录
      # Change to your Obsidian Vault path, or keep ./buckets for local storage
      - ./buckets:/data
      - ./snapshots:/snapshots
