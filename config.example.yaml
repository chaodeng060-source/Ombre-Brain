# ============================================================
# Ombre Brain Configuration / 配置文件
# Copy this file to config.yaml and modify as needed
# 复制此文件为 config.yaml 后按需修改
# ============================================================

# --- Transport / 传输方式 ---
# stdio: local use (Claude Desktop, direct pipe)
# streamable-http: remote use (HTTP, tunnel/CDN/proxy friendly)
# stdio: 本地使用（Claude Desktop，直接管道通信）
# streamable-http: 远程使用（标准 HTTP，对隧道/CDN/代理友好）
transport: "stdio"

# --- Log level / 日志级别 ---
log_level: "INFO"

# --- Bucket storage path / 记忆桶存储路径 ---
# Point this to your Obsidian vault subdirectory, or any local folder
# 指向你的 Obsidian 仓库子目录，或任意本地文件夹
# Leave as-is to use the built-in ./buckets/ directory
# 保持默认则使用内置的 ./buckets/ 目录
# buckets_dir: "/path/to/your/Obsidian Vault/Ombre Brain"

# Every bucket mutation is journaled before the Markdown file is changed.
# Empty path defaults to <buckets_dir>/.audit/mutations.sqlite3.
audit:
  enabled: true
  path: ""

# --- Maintenance / 维护任务 ---
# The legacy relation backfill scans the full embedding library once per
# eligible bucket. Keep it disabled on user-facing servers; use the bounded
# backfill_relations tool manually, or explicitly opt in for a maintenance run.
# 旧关系回填会对每个候选桶重复扫描整库。面向用户的服务应保持关闭；
# 请用 backfill_relations 人工小批执行，或仅在维护窗口显式开启。
maintenance:
  startup_relation_backfill: false  # env: OMBRE_STARTUP_RELATION_BACKFILL

# --- Merge threshold / 桶合并阈值 ---
# When storing a new memory, if similarity with an existing bucket exceeds
# this value (0-100), merge instead of creating a new one
# 存新记忆时，如果与已有桶的相似度超过此值（0-100），则合并而非新建
merge_threshold: 75

# --- Merge candidate fusion / 合并候选融合 ---
# hold/grow write path uses keyword + vector channels to find duplicate buckets.
# A candidate can merge if keyword score exceeds merge_threshold or vector
# similarity exceeds vector_threshold; protected/feel/chord-tagged domains still
# bypass automatic merge.
merge:
  keyword_limit: 5                # Keyword candidates considered for merge
  vector_limit: 8                 # Vector candidates considered for merge
  vector_floor: 0.50              # Ignore vector noise below this similarity
  vector_threshold: 0.78          # Vector-only merge threshold
  candidate_limit: 8              # Max fused candidates checked after RRF ranking

# --- Dehydration API / 脱水压缩 API 配置 ---
# Uses a cheap LLM for intelligent compression; auto-degrades to local
# keyword extraction if API is unavailable
# 用廉价 LLM 做智能压缩，API 不可用时自动降级到本地关键词提取
dehydration:
  # Supports any OpenAI-compatible API: DeepSeek / Ollama / LM Studio / vLLM / Gemini etc.
  # 支持所有 OpenAI 兼容 API：DeepSeek / Ollama / LM Studio / vLLM / Gemini 等
  model: "deepseek-chat"
  base_url: "https://api.deepseek.com/v1"
  # Common base_url examples / 常见 base_url 示例：
  #   DeepSeek:    https://api.deepseek.com/v1
  #   SiliconFlow: https://api.siliconflow.cn/v1
  #   Ollama:      http://localhost:11434/v1
  #   LM Studio:   http://localhost:1234/v1
  #   vLLM:        http://localhost:8000/v1
  #   Gemini:      https://generativelanguage.googleapis.com/v1beta/openai
  # api_key: ""    # ⚠️ Use env var OMBRE_API_KEY instead / 请使用环境变量 OMBRE_API_KEY
  max_tokens: 1024
  temperature: 0.1
  # Persist derived recall summaries in bucket frontmatter.  False restores
  # the prior sidecar-only read path without changing source memory content.
  recall_frontmatter_cache_enabled: true
  # Strict self-containment JSON should not spend its answer budget on hidden
  # reasoning. Official DeepSeek endpoints enable this automatically; set true
  # for compatible DeepSeek proxies, or false to force the generic contract.
  self_containment_disable_thinking: true

# --- LMC-5 conservative night runtime / LMC-5 保守夜班 ---
# Proposer 的结构化 JSON 预算与普通脱水任务分离；输出被截断时仍 fail closed，
# 下次必须用新 run_id 重试，绝不把 partial JSON 当成空候选。
lmc5_night:
  proposer_max_tokens: 4096       # plain integer, 512..8192
  # 同一自然夜的有界重试槽；常态默认 8，积压追平可显式提至 32。
  max_attempts_per_logical_day: 8 # plain integer, 1..32
  # DeepSeek V4 defaults to thinking mode; only enable these for providers that
  # explicitly support the matching OpenAI-compatible request extensions.
  proposer_disable_thinking: false # strict boolean; sends thinking.type=disabled
  proposer_json_object: false      # strict boolean; requests JSON object output
  # 冻结本轮 event_chunks 水位后，只处理一个有界切片；未清空时写入
  # truthful deferred，后续同日 -rN/次日夜班续跑，不伪装 complete。
  proposer_max_chunks_per_run: 128 # plain integer, 1..256; bounded catch-up slice
  # 每次 provider 调用仍只处理一个 chunk；并发只放大独立调用，默认 1。
  proposer_concurrency: 1          # plain integer, 1..8
  proposer_wall_budget_seconds: 3000 # plain integer, 1..3599

# --- XYZME metabolism / M 轴代谢 ---
# report_only 是安全默认：只计算候选，不 resolve/archive/digest，也不把报告写回记忆库。
# 只有人工明确改成 apply 才保留旧的自动变更行为；不接受 yes/true 等模糊别名。
metabolism:
  mode: report_only               # exact enum: report_only | apply

# --- XYZME experience axis / E 轴体验信号 ---
# E0 同时只读扫描 LMC-5 已脱敏 candidate 和五个固定 curated Markdown 根：
# permanent / dynamic / archive / feel / 涩涩。只写 <buckets_dir>/.axis/ 私有 sidecar；
# E0 原始行永久不覆盖记忆，也不参与 decay/RRF/relation/E1。自然日成熟度只描述
# 这份 proposal 样本的观测跨度，不授予召回权威。manual API 标记为
# source_kind=manual_bucket，完全排除于正式 cohort、自然日和分布。
# enabled 只是运行配置，不代表生产已部署；镜像与独立 cron 仍必须通过部署闸。
e_axis_shadow:
  enabled: true                        # absent/false fails closed
  legacy_naive_timestamps_utc: false   # true only for audited legacy full timestamps; date-only still fails
  min_confidence: 0.3
  provider_name: "deepseek"           # required real provider lineage; no generic default
  model: "deepseek-chat"              # may differ from dehydration.model
  rubric_version: "lmc5-experience-20260731-v1"
  max_per_run: 20                     # oldest eligible backlog first, 1..100
  max_tokens: 512                     # strict six-field JSON only, 512..2048
  max_content_chars: 12000            # longer input fails explicitly; never truncates silently
  temperature: 0.0

# --- LMC-5 E1 live projection / E 轴正式召回投影 ---
# 只消费主对话 AI 亲自写入桶内的 E 元数据与不可变初始优先级。DeepSeek 等模型
# 的 E0/shadow 行永远只是 proposal，不参与正式召回。投影只在既有相关性窄带内
# 细排；显式情绪查询最多补 1 条 supporting experience，并注入回应姿态。
# breath 默认只使用 e_authored_by=claude；共享服务上的其他 AI 必须显式传
# 自己的 author id，绝不把一个 AI 的第一人称体验投影给另一个 AI。
# 它不能覆盖事实或跨过 Z 轴；关闭 enabled 即恢复旧召回，不改账本/桶。
e_axis_recall:
  enabled: true
  mode: active
  activation_id: "lmc5-e1-20260804-v1"
  allowed_rubric_versions: ["lmc5-experience-20260731-v1"]
  min_confidence: 0.5
  tie_break_weight: 0.2              # 0..0.25, 且仅在 relevance band 内生效
  side_channel_limit: 1              # 显式情绪查询的额外旁证，0..2
  side_channel_scan_limit: 128       # 先按 E 分数预排，再逐桶验 digest/Z/world/domain
  side_channel_min_resonance: 0.55

# --- Decay parameters / 记忆衰减参数 ---
# 计算艾宾浩斯衰减候选；是否自动归档由 metabolism.mode 控制。
decay:
  lambda: 0.05                    # Decay rate / 衰减速率（越大遗忘越快）
  threshold: 0.3                  # Archive threshold / 归档阈值
  check_interval_hours: 24        # Check interval (hours) / 衰减检查间隔（小时）
  emotion_weights:
    base: 1.0                     # Base weight / 基础权重
    arousal_boost: 0.8            # Arousal boost coefficient / 唤醒度加成系数
  retrieval:                      # Retrieval-time forgetting curve / 检索期遗忘曲线（breath 检索模式排序）
    half_life_days: 14.0          # Half-life / 半衰期（天），14 天前的记忆衰到 50%
    min_decay: 0.25               # Floor for unresolved / 非 resolved 桶的衰减保底（老记忆不归零）
    weight: 0.4                   # Blend weight / 混入强度 0~1（0=关闭，1=纯乘衰减）
    rehearsal_boost: 0.5          # Rehearsal stretch / 复述拉长半衰系数：half_life×(1+boost×log2(1+激活次数))

# --- Narrative layer / 叙事层（内核 3：Event -> Episode -> Saga）---
# Additive consolidation: clusters recent related buckets into episode summaries,
# then folds episodes into long-running sagas. Never mutates source buckets.
# 只增不改：把最近相关的桶卷成 episode 摘要，再把 episode 归并进长线 saga。绝不碰源桶。
# All values have safe code defaults; this block is optional.
# 所有值代码里都有安全默认，本节点可省。
narrative:
  enabled: true                   # Enable narrative engine / 启用叙事层
  interval_hours: 24              # Cycle interval (hours) / 归并周期间隔（小时）
  min_cluster_size: 3             # Min events to form an episode / 成一个 episode 的最小 event 数
  max_cluster_size: 12            # Max events per episode / 单 episode 最多 event 数
  episode_sim_threshold: 0.78     # Semantic continuity cosine / 语义连续性 cosine 阈值
  episode_span_days: 3.0          # Max time span of one episode / 单 episode 时间跨度上限（天）
  episode_lookback_days: 30.0     # Only narrate events newer than this / 只卷这么多天内的新 event
  max_episodes_per_cycle: 5       # Cap episodes built per cycle / 每轮最多卷几个 episode
  max_episodes_into_saga_per_cycle: 8  # Cap episodes routed to sagas per cycle / 每轮最多归并几个 episode 进 saga

# --- Sense entry layer / 五感入口层（嗅/味/触/听）---
# On write, content describing a smell/taste/touch/sound auto-gets a `sense:` tag.
# On breath, a sensory query lifts same-sense buckets (the Proust hook).
# 写入时带感官描述的内容自动打 sense 标签；breath 时感官 query 让同感官桶上浮（普鲁斯特钩子）。
# 结构化 sensory.spicy/touch 也会映射成 sense 通道（味觉/触觉）：合并时自动补、存量桶用 backfill_senses.py 补。
# All values have safe code defaults; this block is optional.
# Env overrides: OMBRE_SENSE_ENABLED (0/false 关), OMBRE_SENSE_RECALL_BOOST (float)。
sense:
  enabled: true                   # Enable sense tagging + recall boost / 启用感官打标+召回上浮
  recall_boost: 1.25              # Score multiplier for same-sense buckets on a sensory query / 同感官桶召回分乘子

# --- Embedding / 向量化配置 ---
# Uses embedding API for semantic similarity search
# 通过 embedding API 实现语义相似度搜索
# Reuses the same API key (OMBRE_API_KEY) and base_url from dehydration config
# 复用脱水配置的 API key 和 base_url
embedding:
  enabled: true                   # Enable embedding / 启用向量化
  model: "gemini-embedding-001"   # Embedding model / 向量化模型

# --- PostgreSQL mirror write queue / PostgreSQL 镜像写入队列 ---
# Optional write-side mirror. SQLite remains the recall authority and PostgreSQL
# failures only retain pending mutations for retry; they never fail bucket writes.
# 可选写侧镜像。SQLite 仍是召回权威；PG 故障只会保留待重试项，不会阻断写桶。
pg_mirror:
  enabled: false                  # env: OMBRE_PG_MIRROR_ENABLED
  database: "ombre_mirror"
  psql_path: "psql"
  queue_path: ""                 # defaults to <buckets_dir>/.pg_mirror/queue.sqlite3
  dimension: 1024
  batch_size: 100
  retry_seconds: 30

# --- Scoring weights / 检索权重参数 ---
# total = topic(×4) + emotion(×2) + time(×1.5) + importance(×1)
scoring_weights:
  topic_relevance: 4.0
  emotion_resonance: 2.0
  time_proximity: 1.5
  importance: 1.0

# --- Fuzzy matching / 模糊匹配参数 ---
matching:
  fuzzy_threshold: 50             # Minimum match score (0-100) / 最低匹配分数
  max_results: 5                  # Max results per search / 单次搜索最多返回条数
  literal_candidate_floor: 40.0   # Original-query topic floor for recall candidates
  keyword_relevance_tie_band: 3.0 # Emotion/time/importance may rerank only within this topic-score gap
  fused_relevance_tie_band: 0.35  # Decay/sense/intent may rerank only within this RRF×1000 gap

# --- RRF fusion / RRF 融合检索 ---
# breath 双通道融合参数：keyword (jieba+rapidfuzz) + vector (embedding)
# score(d) = keyword_weight/(k + rank_keyword(d)) + vector_weight/(k + rank_vector(d))
# k 越大相邻 rank 间分差越平缓；权重默认对称（1:1）
# 向量通道有 sim>0.5 硬阈值底线，挡掉高 cosine 噪音
rrf:
  k: 60                           # rank smoothing constant / 排名平滑常数
  keyword_weight: 1.0             # keyword channel weight / 关键词通道权重
  vector_weight: 1.0              # vector channel weight / 向量通道权重

# --- Entity resolution + alias recall / 实体消歧与别名召回 ---
# Additive SQLite sidecar under <buckets_dir>/.entities; never changes bucket
# frontmatter/body.  Only explicit operator seeds may unify different names.
# The model may identify exact mentions and coarse types, but cannot invent
# alias equivalence.  If one alias points to multiple entities, entity recall
# fails open to the legacy keyword/vector channels instead of guessing.
entities:
  enabled: true
  rrf_weight: 1.0
  top_k: 20
  seeds: []
  # Dedicated deployments can add audited private mappings, for example:
  # - canonical_name: "Example Person"
  #   aliases: ["Example Nickname"]
  #   type: person

# --- Intent-aware recall / 意图感知检索 ---
# Classify breath(query=...) into fact/recall/relation/temporal, then assign
# channel budgets before the existing RRF merge. The default policy mirrors the
# pre-kernel-4 behavior, so low-confidence queries fall back to current recall.
intent_recall:
  enabled: true
  min_confidence: 0.55
  policies:
    default:
      keyword_top_k_multiplier: 1.0
      vector_top_k_multiplier: 1.0
      keyword_weight_multiplier: 1.0
      vector_weight_multiplier: 1.0
      relation_neighbor_limit: 5
      relation_score_boost: 1.0
      emotion_domain_boost: 1.0
      temporal_recent_boost: 1.0
      temporal_recent_days: 14
    fact:
      keyword_top_k_multiplier: 1.35
      vector_top_k_multiplier: 1.15
      keyword_weight_multiplier: 1.35
      vector_weight_multiplier: 1.10
      relation_neighbor_limit: 1
    recall:
      keyword_top_k_multiplier: 1.0
      vector_top_k_multiplier: 1.25
      keyword_weight_multiplier: 1.0
      vector_weight_multiplier: 1.15
      relation_neighbor_limit: 4
    relation:
      keyword_top_k_multiplier: 1.0
      vector_top_k_multiplier: 1.35
      keyword_weight_multiplier: 0.90
      vector_weight_multiplier: 1.20
      relation_neighbor_limit: 8
      relation_score_boost: 1.20
      emotion_domain_boost: 1.15
    temporal:
      keyword_top_k_multiplier: 1.30
      vector_top_k_multiplier: 0.90
      keyword_weight_multiplier: 1.25
      vector_weight_multiplier: 0.85
      relation_neighbor_limit: 2
      temporal_recent_boost: 1.15
      temporal_recent_days: 14

# --- Review gates / 待审闸（对位 lmc-5 的 Z 轴事实演化 + Y 轴关系安全）---
# 机器推断出的 kin/explains 安全关系经审计幂等写入；危险关系和事实冲突
# 挂进 <buckets_dir>/review_queue.jsonl。危险关系候选只有经过
# /api/review_queue/apply-relation 的具名人工审批事务才落图。
# 只读查看：python review_queue.py --path <buckets_dir>/review_queue.jsonl
# 红线：保护域感情桶（恋爱/纪念日/约定/家庭/自省/feel）在合并层已被排除，
#       绝不会被自动 supersede。
review_gate:
  relation_review: true           # dangerous relations queue for named review; safe relations write directly
  fact_evolution_audit: true      # compatibility flag; conflicts stay as separate buckets until explicit Z apply

# --- Fresh-window briefing / 新窗口开机包 ---
# Automatic consumers use a deterministic stored-memory pack.  The generated
# summarizer remains available only when an operator explicitly opts in.
briefing:
  generated_enabled: false
  # Unmarked engineering status may enter the current-window pack only while
  # it is explicitly unresolved and less than one event-day old.
  unaudited_status_max_age_days: 1

# --- Stage-0 query expansion / 查询扩展 ---
# 只在回忆/关系/时间线意图上启用，精确事实查询保留原词，避免改写过头。
# 无 dehydration API 时自动退化为只用原查询。
query_expansion:
  enabled: false
  allowed_intents: [recall, relation, temporal]
  max_angles: 2
  max_tokens: 120
  temperature: 0.3
  min_query_len: 4
  max_query_chars: 500
  # 可选扩写必须先于调用方总闸回退原查询；0/负值会钳到 0.1 秒。
  timeout_sec: 3.0

# Twin 的外层总闸是 14 秒。2026-08-10 真实 auto-breath 分段显示完整请求
# 需 26.5~89.1 秒；11 秒给传输留 3 秒，并在到点时返回已形成的候选。
breath_deadline_sec: 11.0

# --- Recall evidence roles / 召回证据角色 ---
# 主结果角色标记默认关闭以兼容旧客户端；Y 轴 association 无论此开关如何都会显式标成
# supporting_only，避免关系旁证看起来像主事实依据。
recall_evidence_roles:
  enabled: false

# --- Operational status validity / 工程状态有效期 ---
# 只覆盖部署/完成/进度事实。原 Markdown 不迁移、不删除；有效期写在
# <buckets_dir>/.validity/operational_status.sqlite3。关闭后读写链均回到旧行为。
status_validity:
  enabled: true

# --- State-aware fact recall / 状态感知事实召回 ---
# 只读取 Z 轴人工批准后写下的 current/historical 双向链；不建新向量库、不调用模型，
# 也不让状态链进入 RRF 主排序。enabled=false 精确回到原 Z 轴过滤行为。
state_aware_recall:
  enabled: true
  evidence_labels: true
  state_link_limit: 2             # 每次最多补几条已验证的状态链证据（硬上限 3）

# --- Typed relation recall / 类型化关系召回 ---
# propagation_only=false 仅用于紧急回滚到旧行为；默认只允许 explains
# 传播。kin/updates 只记录关系，causes/contributes/improves 留待 review。
relation_recall:
  propagation_only: true
  allowed_types: [kin, explains]  # rollback/legacy mode only
  propagation_types: [explains]
  hop1_min_strength: 0.4
  hop2_min_strength: 0.7

# --- Z-axis fact slots / Z 轴事实槽 ---
# 只有这里登记的规范 key 才被视为事实槽；LLM/桶里临时出现的任意 fact_key 不生效。
# 下列窄约束 UI 槽也是代码内置默认；部署可显式设 registry: {} 关闭全部槽。
# aliases 只用于只读迁移候选扫描，落盘仍使用规范 key。
# fact_status 仅允许 current/historical/contested；resolved 仍是注意力状态，不表示事实过期。
fact_slots:
  enabled: true
  # 夜跑检出的同槽新旧候选是否自动进待审队列（pending，人批准前绝不改桶）。
  # 缺省 true（2026-08-19：上游合同「候选先进 audit」；关掉 = 闭环不存在）。只在误报淹没人审时设 false。
  auto_enqueue_z_candidates: true
  registry:
    preference.ui.primary_color:
      aliases: [主色]
      domains: [创作]
      types: [dynamic]
      tags_any: [UI偏好, 朝灯UI偏好, UI设计, 前端调色]
      name_contains: [UI, 前端, 调色]
    preference.ui.font_style:
      aliases: [字体倾向]
      domains: [创作]
      types: [dynamic]
      tags_any: [UI偏好, 朝灯UI偏好, UI设计, 前端调色]
      name_contains: [UI, 前端, 调色]
    # --- 2026-08-18 Z 轴闭环新增的基础设施事实槽（task_wr_976a40a17657_02）---
    # 这三类事实会随时间翻篇（记忆库搬家 / 电脑换 IP / 换本地模型），旧桶不标 historical
    # 召回就会把旧值当真。约束先只用 types + name_contains，domains 等生产诊断数字校准后再收紧。
    # 候选来源：patrol → z_candidates.propose_z_pair_candidates → review_queue（只入队），
    # fact_status 只有人批准 apply-lifecycle 后才写。
    infra.memory_store.location:
      aliases: [记忆库位置, 记忆库, 海马体位置, 记忆存放]
      types: [dynamic]
      name_contains: [记忆库, 记忆搬, 记忆迁, 海马体, 记忆存放]
      value_patterns: ['memory\.zhaodeng\.xyz', '\bNAS\b', '本地记忆库', '远程记忆库', '记忆库(?:搬|迁)?到(?:了)?\s*([^\s，。,]{2,24})']
    infra.zhaodeng_windows.ip:
      aliases: [真实ip, ip, windows ip, 电脑ip]
      types: [dynamic]
      name_contains: [IP, 内网地址, 朝灯电脑, 朝灯的电脑]
      value_patterns: ['\b(?:10|172|192)\.(?:\d{1,3})\.(?:\d{1,3})\.(?:\d{1,3})\b']
    infra.local_llm.model_name:
      aliases: [本地模型, 模型名, model, 本地模型名]
      types: [dynamic]
      name_contains: [本地模型, 模型名, 模型选型, 换模型, 本地 LLM]
      value_patterns: ['\b(qwen[0-9][a-z0-9._:-]*)', '\b(glm-?[a-z0-9._-]+)', '\b(deepseek-[a-z0-9._-]+)', '\b(llama[0-9][a-z0-9._:-]*)', '\b(gemma[0-9]?[a-z0-9._:-]*)']
    # --- 2026-08-18 23:5x 朝灯定方向：「过时的就是那些工程相关的（进度类）」——工程进度状态槽。
    # 只给人工提候选（tools/ombre_z_review.py candidate）与批准后召回压旧用；不设 value_patterns，
    # 自动候选不会用它成对（值配对只认声明了 value_patterns 的槽）。name_contains 宽是故意的：
    # 压制只对被人批准标 historical 的桶生效，别的桶不受影响。
    engineering.progress.state:
      aliases: [进度, 状态, 待办, 工程进度]
      types: [dynamic]
      name_contains: [待, 未, 阻塞, 上线, 修复, 完成, 进度, 重启, 同步, 卡在, 落地, 交接, 收尾]

# --- World axis / 世界轴 ---
# 用来隔离不同剧情世界的记忆。日常聊天的桶 world 留空（不属于任何世界）；
# 角色扮演场景的桶必须标具体 world；跨世界通用设定标 world="通用"，搜哪个世界都跟着出。
#
# breath 默认行为：根据 current_world 过滤。current_world="" 时只出"日常桶 + 通用"，
# 设了具体世界时只出"该世界 + 通用"，日常桶不浮现。breath(world="all") 跳过过滤。
#
# current_world 由 switch_world MCP 工具在运行时改动，写入 {buckets_dir}/.ombre_runtime.yaml。
# 也可用环境变量 OMBRE_CURRENT_WORLD 覆盖。
worlds:
  - 当前世界
  - 旧世界
  - 通用
current_world: ""

# --- Obsidian wikilinks / Obsidian 双链自动注入 ---
wikilink:
  enabled: true
  use_tags: false
  use_domain: true
  use_auto_keywords: true
  auto_top_k: 4
  min_keyword_len: 3
  exclude_keywords: []
