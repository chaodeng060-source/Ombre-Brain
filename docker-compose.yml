# ============================================================
# Ombre Brain Docker Compose
# Docker Compose 配置
#
# Usage / 使用：
#   1. Create .env with provider and network access tokens.
#      OMBRE_API_TOKEN and OMBRE_MCP_TOKEN are mandatory in network mode.
#   2. docker-compose up -d
#   3. docker compose logs tunnel (for public URL / 查看公网地址)
# ============================================================

services:
  ombre-brain:
    build:
      context: .
      args:
        OMBRE_SOURCE_REVISION: ${OMBRE_DEPLOY_COMMIT:-unknown}
    image: ${OMBRE_IMAGE_REPOSITORY:-ombre-brain}:${OMBRE_IMAGE_TAG:-local}
    container_name: ${OMBRE_CONTAINER_NAME:-ombre-brain}
    network_mode: ${OMBRE_NETWORK_MODE:-bridge}
    restart: unless-stopped
    ports:
      # Publish on host loopback only. Host cloudflared reaches 127.0.0.1;
      # LAN clients must not bypass the authenticated public endpoint.
      - "${OMBRE_BIND_ADDRESS:-127.0.0.1}:${OMBRE_HOST_PORT:-8000}:8000"
    env_file:
      - .env                               # Pass provider/R2/filter env without hard-coding secrets
    environment:
      - OMBRE_API_KEY=${OMBRE_API_KEY}      # From .env file / 从 .env 文件读取
      - OMBRE_TRANSPORT=streamable-http     # Claude.ai requires streamable-http
      - OMBRE_BUCKETS_DIR=/data             # Container-internal bucket path / 容器内路径
      - OMBRE_API_TOKEN=${OMBRE_API_TOKEN:?required} # /api/* Bearer token
      - OMBRE_MCP_TOKEN=${OMBRE_MCP_TOKEN:?required} # /mcp,/sse,/messages Bearer token
      - OMBRE_LMC5_NIGHT_ENABLED=1       # Disable drifting 24h loops; cron owns the run
      - OMBRE_LMC5_SNAPSHOT_DIR=/snapshots
    volumes:
      # Mount your Obsidian vault (or any host directory) for persistent storage
      # 挂载你的 Obsidian 仓库（或任意宿主机目录）做持久化存储
      # Example / 示例:
      #   - /path/to/your/Obsidian Vault/Ombre Brain:/data
      - ${OMBRE_DATA_DIR:-/vol1/ombre-data}:/data
      - ${OMBRE_SNAPSHOT_DIR:-/vol1/ombre-night-snapshots}:/snapshots
      - ${OMBRE_CONFIG_FILE:-./config.yaml}:/app/config.yaml
      - type: volume
        source: ombre-buckets
        target: /app/buckets

  # Cloudflare Tunnel — 在朝灯 NAS 上已由 host 上的 cloudflared systemd/手起进程承担
  #（zhaodeng 用户跑 `cloudflared tunnel --config ~/.cloudflared/config.yml run ombre`）
  # 故此处 service 段长期禁用；若 host 进程没了再启此段做兜底。下次 `docker compose up`
  # 不会再勾起空 ombre-tunnel 容器 fail。
  #
  # tunnel:
  #   image: cloudflare/cloudflared:latest
  #   container_name: ombre-tunnel
  #   restart: unless-stopped
  #   command: >
  #     tunnel --no-autoupdate --protocol http2
  #     --config /etc/cloudflared/config.yml
  #     --proxy-keepalive-timeout 300s
  #     --proxy-connection-timeout 300s
  #     run
  #   volumes:
  #     - /home/zhaodeng/.cloudflared:/etc/cloudflared
  #   depends_on:
  #     - ombre-brain

volumes:
  ombre-buckets:
    name: ${OMBRE_BUCKETS_VOLUME:-ombre-buckets}
    external: ${OMBRE_BUCKETS_VOLUME_EXTERNAL:-false}
